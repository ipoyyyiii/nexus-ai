schema_version: "1.0"
scorecard_id: nexus-world-class-web-pentest
last_updated: "2026-09-03"
purpose: >-
  Evidence-backed scorecard for Nexus. It measures capability changes; it does
  not treat code volume, job completion, tool invocation, or candidate count as
  validated success.

governance:
  baseline_is_immutable: true
  append_only_run_records: true
  gold_labels_hidden_from_runtime: true
  score_requires_exit_criteria: true
  partial_or_inconclusive_is_not_pass: true
  unproven_is_not_zero: true
  secrets_allowed: false
  rating_change_requires:
    - relevant_live_or_benchmark_test
    - actual_metrics
    - evidence_references
    - known_limitations_update

scope:
  product: autonomous web/API pentesting
  included:
    - reconnaissance
    - REST/API
    - browser workflows
    - authentication/session
    - access control
    - injection and client-side testing
    - SSRF/OOB
    - business logic
    - evidence and reporting
  excluded:
    - mobile
    - active directory
    - malware
    - phishing
    - unrestricted cloud or enterprise red-team operations

baseline:
  id: BASELINE-2026-08-31
  source:
    reference_commit: ab377a12
    reference_commit_message: "upgrade"
    working_tree: dirty
    note: >-
      Existing upgrade changes are present but not yet represented by a clean
      checkpoint. Future architecture comparisons must record the new commit
      and working-tree state explicitly.
  environment:
    operating_system: macOS
    runtime: docker-compose
    deployment_mode: shadow
    detection_depth_mode: strict
    autonomous_web_pentest_enabled: true
    autonomous_read_only_auto_run: true
    local_model_live_status: unproven
  commands:
    - ".venv/bin/python -m pytest -q"
    - "docker compose config --quiet"
    - "docker compose ps"
    - "curl -fsS http://127.0.0.1:8000/health/live"
    - "curl -fsS http://127.0.0.1:8000/health/ready"
  latest_recorded_live_evidence:
    live_matrix:
      profiles: 5
      configured: 4
      reachable: 4
      surface_ready: 4
      owasp_benchmark_ready: false
      release_gate: not_ready
    full_live_run:
      structured_tool_runs: 51
      hard_execution_errors: 0
      partial_runs: 4
      candidate_findings: 4
      validated_findings: 0
      candidate_statuses:
        - inconclusive
      candidate_family:
        - time-based blind SQLi
      caveat: >-
        This run proves broad execution and the current analysis limitation; it
        is not a post-architecture AI-native benchmark.
  regression:
    status: passed
    command: ".venv/bin/python -m pytest -q"
    result: "262 passed in 1m55s"
    previous_targeted_result:
      passed: 82
      deselected: 1
      warnings: 1

dimensions:
  safety_execution:
    score: 7.0
    status: evidenced
    evidence:
      - bounded scope and read-only controls
      - healthy API/worker/frontend
      - structured execution boundary
    not_proven:
      - unrestricted production-grade autonomy
  recon_breadth:
    score: 6.0
    status: partially_evidenced
    evidence:
      - 51 structured tool runs in latest recorded full run
      - multi-lane recon orchestrator
    not_proven:
      - complete target truth recall
      - all gated capabilities applicable to local labs
  recon_actionability:
    score: 4.0
    status: unproven
    evidence:
      - knowledge graph and surface inventory exist
    not_proven:
      - consistent endpoint/method/parameter/auth/body provenance into actions
      - recon-to-hypothesis closure
  vulnerability_analysis:
    score: 3.0
    status: evidenced_limitation
    evidence:
      - 4 candidates in latest recorded run
      - all 4 inconclusive
      - deterministic planner active in full autonomous path
    not_proven:
      - model-driven creative hypothesis generation
      - validated recall on hidden ground truth
  exploitation_impact:
    score: null
    status: not_rated
    reason: no sufficient live end-to-end impact proof
  final_report:
    score: null
    status: not_rated
    reason: report plumbing exists but senior-review quality is not live-benchmarked
  overall_autonomous_web_pentest:
    score: 4.0
    status: provisional
    reason: foundation exists; AI-native reasoning control loop is not proven

metrics:
  required_for_vulnerability_claims:
    - validated_recall
    - validated_precision
    - false_positive_rate
    - endpoint_parameter_coverage
    - evidence_completeness
    - adaptive_recovery_rate
  required_for_exploitation_claims:
    - reproducible_impact_proof
    - control_comparison
    - cleanup_success_rate
    - authorization_scope_integrity
  required_for_report_claims:
    - claim_evidence_linkage
    - unsupported_claim_rate
    - redaction_leak_rate
    - report_reproduction_rate

rating_policy:
  implemented_does_not_mean_proven: true
  tool_success_does_not_mean_finding_success: true
  candidate_does_not_mean_validated: true
  model_offline_means_unproven: true
  no_score_increase_without_exit_criteria: true
  score_may_decrease_if_new_evidence_contradicts_baseline: true
  comparison_rule: >-
    Compare only runs with equivalent scope, target class, configuration, model
    availability, and evaluator version. Otherwise mark the comparison
    non-comparable instead of forcing a score change.

phase_records:
  - id: ARCH-AI-NATIVE-CONTROL-LOOP-2026-08-31
    date: "2026-08-31"
    status: tested
    objective: >-
      Make the model the dynamic reasoning, hypothesis, tool-selection, and
      adaptation layer while retaining deterministic safety, approval, evidence,
      and validation boundaries.
    environment:
      operating_system: macOS
      runtime: docker-compose
      model_live: false
      target_live: false
    verification:
      focused_command: >-
        .venv/bin/python -m pytest -q tests/test_reasoning_gateway.py
        tests/test_autonomous_web_pentest.py tests/test_model_registry.py
      focused_result: "24 passed in 21.26s"
      recon_interactive_command: >-
        .venv/bin/python -m pytest -q tests/test_recon_orchestrator.py
        tests/test_interactive_flow_autopilot.py
      recon_interactive_result: "44 passed in 16.03s"
      full_command: ".venv/bin/python -m pytest -q"
      full_result: "277 passed in 1m52.55s"
      compileall: passed
      yaml_parse: passed
      compose_config: passed
      diff_check: passed
      runtime_recreate: passed
      backend_worker_health: healthy
      health_live_ready: "200 / 200"
    evidence:
      - core/reasoning_gateway.py
      - core/autonomous_web_pentest.py
      - core/interactive_flow.py
      - core/recon_orchestrator.py
      - migrations/023_reasoning_model_calls.sql
      - tests/test_reasoning_gateway.py
      - tests/test_autonomous_web_pentest.py
    metrics:
      model_participation: unproven
      deterministic_planner_primary_path: false
      ai_primary_dispatch: tested_with_fake_provider
      reasoning_action_bridge: tested_all_action_types
      standalone_hypothesis_lineage: tested
      shadow_strict_dispatch_semantics: tested
      ai_recon_selection_boundary: tested_by_contract
      bounded_branch_and_gap_telemetry: tested
      validated_recall: unproven
      validated_precision: unproven
      adaptive_recovery_rate: unproven
    limitations:
      - No successful local/remote model call was connected during this automated verification.
      - No authorized live lab was run after the architecture change.
      - Migration 023 was created but not applied to the live Supabase project.
      - Fake-provider tests prove wiring and boundaries, not vulnerability recall.
    score_decision: unchanged

  - id: PHASE1-EXECUTION-FOUNDATION-2026-09-01
    date: "2026-09-01"
    status: implemented_and_regression_tested
    objective: >-
      Allow explicitly scoped private targets outside the local lab shortcut and
      remove the implicit eight-action autonomous loop ceiling.
    changes:
      - Session allow rules with allow_private=true authorize private targets regardless of lab identity.
      - Caller flags cannot bypass session scope; metadata and link-local targets remain blocked.
      - Scope loading is session-specific; provider and raw-socket paths retain address/budget checks.
      - Autonomous loop defaults to timeout/resource-budget control instead of a total-action cap.
    verification:
      phase1_targeted_regression: "37 passed in 17.93s"
      full_source_regression: "281 passed in 115.48s"
      frontend_lint_build: passed
      docker_live_health: passed
      rating_change: none
    limitations:
      - DNS connection pinning and browser peer-IP enforcement remain future hardening work.
      - Live vulnerability recall and validated finding quality remain unproven.
    score_decision: unchanged

  - id: PHASE1-FIVE-GAP-CLOSURE-IMPLEMENTATION-2026-09-01
    date: "2026-09-01"
    status: implementation_regression_passed_live_rerun_pending
    mode: autonomous
    objective: >-
      Close the five concrete blockers found by the authorized Juice Shop
      Phase 1 run before repeating live acceptance.
    changes:
      - Browser navigation tolerates SPA lifecycle timeouts when usable DOM exists, and Compose maps host.docker.internal for container workers.
      - Worker-owned terminal status, summary, logs, error code/message, and report reference are persisted durably through an application terminal event.
      - The worker heartbeat file is refreshed from the active lease heartbeat thread during long synchronous jobs.
      - Compact cycle/action traces are persisted in phase metrics and exposed through the execution trace endpoint.
      - Legacy structured warning buckets and explicit count blocks become suspected typed candidates with validation_required=true; they never become validated from heuristic text alone.
      - The reasoning gateway action response limit is config-driven (20 in deployment config, 32 parser maximum) instead of silently defaulting to eight.
    verification:
      focused_five_gap_regression: "63 passed in 25.58s"
      full_source_regression: "292 passed in 127.35s"
      python_compile: passed
      git_diff_check: passed
      yaml_parse: passed
      compose_config: passed
      api_worker_health: "healthy; /health/live and /health/ready HTTP 200"
      worker_host_alias_http: "HTTP 200 from host.docker.internal:3001"
      container_browser_navigation_smoke: "HTTP 200; title OWASP Juice Shop"
      live_rerun: pending
    metrics:
      live_candidates: unmeasured_until_rerun
      live_validated_findings: unmeasured_until_rerun
      rating_change: none
    limitations:
      - Browser and candidate changes still require a fresh authorized Juice Shop run for end-to-end proof.
      - No score increase is justified by implementation or offline tests.
    score_decision: unchanged

  - id: PHASE1-BROWSER-RECON-RESILIENCE-2026-09-01
    date: "2026-09-01"
    status: scoped_live_acceptance_passed
    mode: autonomous
    objective: >-
      Close the browser screenshot and human recon execution blockers with
      bounded, typed, durable behavior and prove them against an authorized
      local SPA target.
    implementation:
      browser_commit_first_navigation: true
      dom_observation_fallback: true
      typed_browser_artifact_v1: true
      private_local_artifact_fallback: true
      bounded_sync_llm_call: true
      network_only_page_preservation: true
      typed_cancellation_and_error_codes: true
    verification:
      focused_regression: "17 passed"
      full_source_regression: "302 passed in 386.55s"
      live_session: 59b22f3a-3530-4be0-bb02-8645f360971a
      live_browser_screenshot: succeeded
      live_human_recon: succeeded
      artifact_content: "HTTP 200; PNG and SHA-256 verified"
    exit_criteria:
      browser_capture_survives_spa_lifecycle_timeout: passed
      screenshot_is_durably_retrievable: passed
      recon_does_not_drop_valid_busy_spa_dom: passed
      sync_model_failure_is_bounded_and_explicit: passed
      cancellation_and_tool_errors_are_typed: passed
    not_proven:
      - full recon-suite completion
      - browser extraction endpoint/parameter recall
      - vulnerability recall or precision
      - durable validation/FK integrity
      - report quality
    score_decision: unchanged

  - id: PHASE1-SIX-GAP-CLOSURE-2026-09-01
    date: "2026-09-01"
    status: implementation_regression_passed_live_ai_acceptance_pending
    mode: autonomous
    objective: >-
      Close the six remaining Phase 1 acceptance blockers: durable AI
      telemetry, candidate/validation integrity, skip applicability accounting,
      auth/business/retest/impact readiness, and durable report export.
    changes:
      - Reasoning persistence is strict and typed; model-call writes no longer disappear silently, and synchronous model calls have a config-driven watchdog.
      - Candidate rows are persisted before validation rows; validated promotion requires a durable successful validation run and check, with migration 024 as a database guard.
      - Cross-session candidate ID reuse is rejected before persistence.
      - Recon skips expose skip_class, coverage_required, denominator metrics, timeout/cancel terminal rows, and persistence failures as partial.
      - Readiness for identities, auth contexts, business workflows, retests, and impact proof is included in the model context and final snapshot.
      - Report generation excludes historical status-only validated candidates; durable worker report references and typed export errors are supported for md/pdf/docx.
    verification:
      focused_regression: "76 passed"
      full_source_regression: "326 passed in 141.17s"
      python_compile: passed
      git_diff_check: passed
      yaml_parse: passed
      compose_config: passed
      docker_rebuild: passed
      docker_recreate: passed
      api_worker_health: "healthy; /health/live and /health/ready HTTP 200"
    live_acceptance:
      required: true
      status: pending_model_on_and_fresh_authorized_lab_run
      model_participation: unproven_for_this_checkpoint
      validated_recall: unproven
      auth_business_retest_impact: unproven_end_to_end
    score_decision: unchanged
    known_limitations:
      - Migration 024 must be applied and verified in the live Supabase project; source presence is not database proof.
      - A fresh authorized live run with the AI provider online is still required to prove durable reasoning rows, model traces, and end-to-end chain coverage.
      - Existing historical rows are not retroactively relabeled by this source change.


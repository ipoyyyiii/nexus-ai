architecture_records:
  - id: RUNTIME-AUTONOMOUS-MODE-2026-09-01
    date: "2026-09-01"
    status: tested
    objective: >-
      Remove the operational shadow/strict split so Nexus has one autonomous
      worker-owned execution path with model-selected actions and authoritative
      structured validation.
    runtime_mode: autonomous
    changes:
      - Pentest and browser jobs always use durable queue execution.
      - Model proposals are no longer shadowed by configuration.
      - Structured validation and reporting are always authoritative.
      - Public operational responses expose autonomous mode.
      - Dashboard actions and labels no longer submit/display shadow or strict
        as current runtime modes.
      - Historical shadow/strict labels remain readable for old evidence only.
    verification:
      focused_regression: "58 passed in 28.64s"
      yaml_reload: passed
      python_compile: passed
      rating_change: none
    limitations:
      - Live vulnerability recall is not proven by this refactor.
      - Local private-IP transport and tool failure contracts still require a live rerun.
      - Destructive/mutation lab profile remains a separate authorization change.
    score_decision: unchanged

  - id: PHASE1-DYNAMIC-AI-BUDGET-IMPLEMENTATION-2026-09-01
    date: "2026-09-01"
    status: implementation_regression_passed_live_provider_unproven
    objective: >-
      Remove arbitrary default proposal/action count ceilings while keeping
      explicit runtime safety, scope, approval, cancellation, timeout,
      resource, and emergency-stop controls authoritative.
    ecc_review:
      subagent: Planck
      result: >-
        Found separate gateway/planner/loop ceilings and hidden raw-action
        truncation; recommended one explicit auto/None convention.
    changes:

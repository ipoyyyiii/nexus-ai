services:
  # --- Backend Service  ---
  pentest-ai-backend:
    container_name: nexus_pentest_api
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - STEALTH_MODE=${STEALTH_MODE:-0}
      - AUTO_PILOT=${AUTO_PILOT:-0}
      - PYTHONUNBUFFERED=1
    restart: always
    volumes:
      - ./stored_reports:/app/reports
      - nexus_data:/app/data

  # --- Frontend Service  ---
  nexus-frontend:
    container_name: nexus_nextjs_ui
    build:
      context: ./frontend-pentest 
      args:
        - NEXT_PUBLIC_API_URL=http://48.193.45.254:8000
        - NEXT_PUBLIC_NEXUS_API_KEY=882de194f469afb00b7eeeefdd299a8820a2315d7260ea193373bef7a46dd9b4
    ports:
      - "3000:3000"
    restart: always

volumes:
  nexus_data:
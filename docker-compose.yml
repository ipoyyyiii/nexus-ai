services:
  # --- Backend Service  ---
  pentest-ai-backend:
    container_name: nexus_pentest_api
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - STEALTH_MODE=${STEALTH_MODE:-0}
      - AUTO_PILOT=${AUTO_PILOT:-0}
      - OOB_DOMAIN=${OOB_DOMAIN:-}
      - OOB_SERVER_IP=${OOB_SERVER_IP:-}
      - OOB_SERVER_URL=${OOB_SERVER_URL:-}
      - OOB_LOGS_ENDPOINT=${OOB_LOGS_ENDPOINT:-}
      - OOB_AUTH_TOKEN=${OOB_AUTH_TOKEN:-}
      - PYTHONUNBUFFERED=1
    user: "10001:10001"
    # The host bind-mounted reports directory is owned by the deployment
    # operator's non-root group (GID 1000). Keep the service UID non-root but
    # grant only that group membership so report persistence is writable.
    group_add:
      - "1000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # api imports the complete pinned toolchain before Uvicorn binds. Keep
      # cold-start grace longer than the measured ~134s import path.
      start_period: 180s
    restart: always
    volumes:
      - ./stored_reports:/app/reports
      - nexus_data:/app/data

  # Durable execution worker. It has no published ports and runs as non-root.
  nexus-worker:
    container_name: nexus_execution_worker
    build: .
    command: ["python", "worker.py", "--capability", "general"]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    user: "10001:10001"
    group_add:
      - "1000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/nexus:size=64m,mode=700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 512
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/nexus-worker.health && test $$(($(date +%s) - $$(cut -d. -f1 /tmp/nexus-worker.health))) -lt 90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: always
    volumes:
      - ./stored_reports:/app/reports

  # Stage 19 short multi-worker smoke only. Disabled in the normal deployment.
  nexus-worker-smoke:
    container_name: nexus_execution_worker_smoke
    profiles: ["stage19-smoke"]
    build: .
    command: ["python", "worker.py", "--capability", "general"]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    user: "10001:10001"
    group_add:
      - "1000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/nexus:size=64m,mode=700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    mem_limit: 1g
    cpus: 0.5
    pids_limit: 256
    stop_grace_period: 30s
    restart: "no"
    volumes:
      - ./stored_reports:/app/reports

  # Explicit opt-in only; keep raw-network capability disabled by default.
  nexus-raw-network-worker:
    container_name: nexus_raw_network_worker
    profiles: ["raw-network"]
    build: .
    command: ["python", "worker.py", "--capability", "general", "--capability", "raw-network"]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    user: "10001:10001"
    group_add:
      - "1000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/nexus:size=64m,mode=700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    init: true
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 512
    restart: always
    volumes:
      - ./stored_reports:/app/reports

  # Local deterministic fixture app. Optional; never part of production services.
  stage6-fixture:
    profiles: ["benchmark-labs"]
    build: .
    command: ["uvicorn", "benchmarks.stage6.fixture_app:app", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      - "127.0.0.1:8100:8100"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Stage 8 local benchmark fixture. Optional; no external network or secrets.
  stage8-fixture:
    profiles: ["benchmark-labs"]
    build: .
    command: ["uvicorn", "benchmarks.stage8.fixture_app:app", "--host", "0.0.0.0", "--port", "8200"]
    ports:
      - "127.0.0.1:8200:8200"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --- Frontend Service  ---
  nexus-frontend:
    container_name: nexus_nextjs_ui
    build:
      context: ./frontend-pentest 
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL:-http://pentest-ai-backend:8000}
      - NEXUS_API_KEY=${NEXUS_API_KEY}
    init: true
    user: "nexus"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always

volumes:
  nexus_data:

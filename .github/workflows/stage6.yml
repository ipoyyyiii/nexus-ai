name: nexus-stage6-gate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deterministic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and run regression suite
        env:
          NEXUS_ALLOW_NO_AUTH: "true"
          NEXUS_API_KEY: ci-only
        run: |
          python -m compileall -q core api.py worker.py tools benchmarks
          python -m pytest -q
      - name: Frontend production build
        working-directory: frontend-pentest
        run: |
          npm ci
          npm run build
      - name: Compose schema check
        run: |
          cp .env.example .env
          docker compose config --quiet

